name: CI

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]
  workflow_dispatch:
    inputs:
      promotion_pr:
        description: Frozen promotion PR number (omit for source CI)
        type: string
        default: ""

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changes:
    name: Change Classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.classify.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROMOTION_PR: ${{ inputs.promotion_pr }}
        run: node scripts/ci/selection.mjs classify

  website:
    name: Website
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.selection).website }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://inkbyte.ca
      INKBYTE_API_URL: http://localhost:26090
      NEXT_PUBLIC_VERCEL_INSIGHTS_ENABLED: "true"
      # Public/fixture acceptance deliberately runs without hosted account keys.
      SITE_NOINDEX: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
          runtime: node@24.21.0
      - run: pnpm install --frozen-lockfile
      - id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: browser-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
      - id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/website/.next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build:website
      - run: pnpm --filter website exec playwright install --with-deps chromium
      - run: pnpm test:website
      - if: ${{ github.event_name != 'pull_request' && github.ref_protected && steps.browser-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - if: ${{ github.event_name != 'pull_request' && github.ref_protected && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/website/.next/cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  website-quality:
    name: Website Quality
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.selection)['website-quality'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
          runtime: node@24.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:website
      - run: pnpm check-types:website

  contracts:
    name: TypeScript Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.selection).contracts }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:inkbyte_test@127.0.0.1:5432/inkbyte_test
      DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
          runtime: node@24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Start disposable CI test services
        run: docker compose --file docker-compose.ci.yml up --detach --wait
      - run: pnpm build
      - run: pnpm test:db:setup
      - run: pnpm test
      - name: Tear down disposable CI test services
        if: ${{ always() }}
        run: docker compose --file docker-compose.ci.yml down --volumes

  contracts-quality:
    name: TypeScript Quality
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.selection)['contracts-quality'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
          runtime: node@24.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: bash scripts/ci/run-actionlint.sh
      - run: node --test scripts/deploy/*.test.mjs
      - run: node --test scripts/*.test.mjs
      - run: pnpm check-types

  image-api:
    name: API Container Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.selection)['image-api'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-website:
    name: Website Container Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.selection)['image-website'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.website
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      [
        changes,
        website,
        website-quality,
        contracts,
        contracts-quality,
        image-api,
        image-website,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/selection.mjs gate
