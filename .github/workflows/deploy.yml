name: Deploy
on:
  push:
    branches: [production]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  publish:
    name: Publish images
    if: github.repository == 'miniaxolotl/inkbyte' && github.ref == 'refs/heads/production' && github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      website_digest: ${{ steps.website.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm production still points at this commit
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq .object.sha)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Wait for independent exact-source CI
        run: node scripts/ci/wait-ci.mjs
      - name: Validate production configuration before publication
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_APP_ID: ${{ vars.DIGITALOCEAN_APP_ID }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'JS'
          const required = ['DIGITALOCEAN_ACCESS_TOKEN', 'DIGITALOCEAN_APP_ID', 'MIGRATION_DATABASE_URL', 'VERCEL_TOKEN', 'VERCEL_ORG_ID', 'VERCEL_PROJECT_ID', 'CLERK_SECRET_KEY', 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY'];
          const missing = required.filter(key => !process.env[key]?.trim());
          if (missing.length) throw new Error(`Missing production configuration: ${missing.join(', ')}`);
          if (!process.env.CLERK_SECRET_KEY.startsWith('sk_live_') || !process.env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY.startsWith('pk_live_')) throw new Error('Use dedicated production Clerk keys');
          const url = new URL(process.env.MIGRATION_DATABASE_URL);
          if (url.hostname.includes('-pooler.') || url.searchParams.get('sslmode') !== 'verify-full') throw new Error('Migrations require a direct PostgreSQL connection with verified TLS');
          JS
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}-api:latest
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: website
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.website
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-website:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}-website:latest
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy services
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply forward-only Neon migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_SSL: require
        run: pnpm db:migrate
      - name: Register short domains
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_SSL: require
          DEFAULT_DOMAINS: inkb.ca,inkbyte.ca
        run: pnpm db:seed
      - name: Deploy the exact API image to DigitalOcean App Platform
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_APP_ID: ${{ vars.DIGITALOCEAN_APP_ID }}
          INKBYTE_IMAGE_DIGEST: ${{ needs.publish.outputs.api_digest }}
        run: |
          set -euo pipefail
          test -n "$DIGITALOCEAN_APP_ID"
          node scripts/deploy/src/digitalocean.mjs --app-id "$DIGITALOCEAN_APP_ID" --digest "$INKBYTE_IMAGE_DIGEST" --wait
      - name: Verify API readiness
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          set -euo pipefail
          test -n "${API_ORIGIN:-}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "${API_ORIGIN}/health/ready" > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 10
          done
          echo "API did not become ready" >&2
          exit 1
      - name: Deploy the website to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          INKBYTE_API_URL: ${{ vars.API_ORIGIN }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Vercel deployment variables are not configured" >&2
            exit 1
          fi
          for key in SITE_URL INKBYTE_API_URL NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY; do
            printf '%s' "${!key}" | npx --yes vercel@65.2.0 env add "$key" \
              --environment production --force --yes --project "$VERCEL_PROJECT_ID" \
              --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          done
          npx --yes vercel@65.2.0 pull \
            --yes --environment=production --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID"
          npx --yes vercel@65.2.0 build \
            --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          npx --yes vercel@65.2.0 deploy --prebuilt \
            --yes --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
