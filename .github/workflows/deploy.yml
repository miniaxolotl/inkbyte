name: Deploy
on:
  push:
    branches: [production]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  publish:
    name: Publish images
    if: github.repository == 'miniaxolotl/inkbyte' && github.ref == 'refs/heads/production' && github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      website_digest: ${{ steps.website.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm production still points at this commit
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq .object.sha)" = "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}-api:latest
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: website
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.website
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-website:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}-website:latest
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy services
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy the API to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
          API_IMAGE: ghcr.io/${{ github.repository }}-api@${{ needs.publish.outputs.api_digest }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ] || [ -z "${RAILWAY_PROJECT_ID:-}" ] || [ -z "${RAILWAY_SERVICE_ID:-}" ]; then
            echo "Railway deployment variables are not configured" >&2
            exit 1
          fi
          npx --yes @railway/cli@latest --version
          npx --yes @railway/cli@latest variables set \
            --service "$RAILWAY_SERVICE_ID" \
            --project "$RAILWAY_PROJECT_ID" \
            --kv "DOCKERIMAGE=$API_IMAGE" \
            --skip-deploys
          npx --yes @railway/cli@latest up \
            --service "$RAILWAY_SERVICE_ID" \
            --project "$RAILWAY_PROJECT_ID" \
            --detach
      - name: Verify API readiness
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          set -euo pipefail
          test -n "${API_ORIGIN:-}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "${API_ORIGIN}/health/ready" > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 10
          done
          echo "API did not become ready" >&2
          exit 1
      - name: Deploy the website to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          INKBYTE_API_URL: ${{ vars.API_ORIGIN }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Vercel deployment variables are not configured" >&2
            exit 1
          fi
          npx --yes vercel@latest pull \
            --yes --environment=production --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID"
          npx --yes vercel@latest build \
            --yes --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" \
            --build-env SITE_URL="$SITE_URL" \
            --build-env INKBYTE_API_URL="$INKBYTE_API_URL" \
            --build-env NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          npx --yes vercel@latest deploy \
            --yes --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
