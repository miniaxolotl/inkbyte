name: inkbyte

x-runtime: &runtime
  NODE_ENV: production
  PORT: 26090
  DATABASE_SSL: ${DATABASE_SSL:-disable}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-8}
  DATABASE_ACQUIRE_TIMEOUT_MS: ${DATABASE_ACQUIRE_TIMEOUT_MS:-2000}
  DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-10000}
  API_ORIGIN: ${API_ORIGIN:-http://localhost:26090}
  SITE_URL: ${SITE_URL:-http://localhost:3000}
  # The API validates these at boot, so Postgres alone can run without Clerk.
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
  CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
  CLERK_ISSUER: ${CLERK_ISSUER:-}
  TRACKING_SECRET: ${TRACKING_SECRET:-}
  DEFAULT_DOMAINS: ${DEFAULT_DOMAINS:-inkb.ca,inkbyte.ca}

services:
  # Local development database. Production uses Neon; see documentation/deploy.md.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inkbyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a local database password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-inkbyte}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - database

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: inkbyte-api:local
    command: ["node", "dist/migrate.js"]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inkbyte}}
      DATABASE_SSL: ${DATABASE_SSL:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - database

  seed:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: inkbyte-api:local
    command: ["node", "dist/seed.js"]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inkbyte}}
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      DEFAULT_DOMAINS: ${DEFAULT_DOMAINS:-inkb.ca,inkbyte.ca}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - database

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: inkbyte-api:local
    restart: unless-stopped
    environment:
      <<: *runtime
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inkbyte}}
    ports:
      - "127.0.0.1:${API_PORT:-26090}:26090"
    depends_on:
      seed:
        condition: service_completed_successfully
    networks:
      - database
      - inkbyte

  website:
    build:
      context: .
      dockerfile: Dockerfile.website
    image: inkbyte-website:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      INKBYTE_API_URL: ${INKBYTE_API_URL:-http://api:26090}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - inkbyte

networks:
  database:
    internal: true
  inkbyte:
    driver: bridge

volumes:
  postgres-data:
